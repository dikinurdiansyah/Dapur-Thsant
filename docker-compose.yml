services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    environment:
      APP_NAME: "${APP_NAME:-Dapur TH Sant}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY:?Set APP_KEY in Coolify}"
      APP_URL: "${APP_URL:?Set APP_URL in Coolify}"
      DB_CONNECTION: mysql
      DB_HOST: "${DB_HOST:?Set DB_HOST to the Coolify database hostname}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:?Set DB_DATABASE in Coolify}"
      DB_USERNAME: "${DB_USERNAME:?Set DB_USERNAME in Coolify}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in Coolify}"
      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: "true"
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
    volumes:
      - laravel_storage:/var/www/html/storage

volumes:
  laravel_storage:
